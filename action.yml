name: Notify PHP Releases
description: A GitHub Action that creates an issue when a new PHP version is released.
author: Dominik Szamburski

branding:
  icon: package
  color: blue

inputs:
  localfile:
    required: false
    default: .releases
    description: The local file containing the currently used PHP releases.
  repo-token:
    required: true
    description: Token used to create and search GitHub issues.
    default: ${{ github.token }}
  owner:
    required: true
    description: The account owner of the repository. The name is not case sensitive.
  repo:
    required: true
    description: The name of the repository without the .git extension. The name is not case sensitive.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - uses: sxbrsky/latest-php-releases-action@1.0.0
      id: latest-releases
    - run: node ${{ github.action_path }}/dist/index.js
      shell: bash
      env:
        RELEASES: ${{ steps.latest-releases.outputs.releases }}
        LOCALFILE: ${{ inputs.localfile }}
        OWNER: ${{ inputs.owner }}
        REPO: ${{ inputs.repo }}
        REPO_TOKEN: ${{ inputs.repo-token }}
